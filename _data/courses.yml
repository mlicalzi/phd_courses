  hours: 20
  period: "Nov.-Dec."
  in_person: "Y"
  online: "Y"
  syllabus: https://www.corsi.univr.it/?ent=cs&id=1008&menu=studiare&tab=insegnamenti&codiceCs=DR-EF226&codins=dt001089&aa=2026/2027&lang=en


# One entry per course. The page groups entries by `university`, so write the university
# name identically in every entry of that university (it is also the heading and the label
# in the navigation bar). Entries keep the order of this file within each university.
#
# Fields, following the SECS-S06 inventory (all optional except `university` and `title`):
#   university    display name, e.g. "Roma 1" or "Ca' Foscari"
#   phd_program   "Denominazione dottorato"
#   coordinator   "Coordinatore"
#   title         "Denominazione corso"
#   instructor    "Docente"
#   url           optional link for the title (course page)
#   hours         "Numero di ore approssimativo"
#   period        "Periodo di erogazione"
#   intensive     "Intensivo o meno"
#   in_person     "Fruizione in presenza" (external students)
#   online        "Fruizione online" (external students)
#   syllabus      "Syllabus"              (use a | block for several lines)
#   notes         "Note"
#
# YAML PITFALL: write short answers in quotes. Jekyll reads a bare No, Yes, On or Off as the
# boolean false/true. The page prints them back as No/Yes anyway, but quoting keeps exactly
# what the university wrote ("No", "Sì", "SI, obbligatoria", "Su richiesta").

- university: Università Ca' Foscari Venezia
  id: unive
  phd_program: Economics
  coordinator: Francesca Zantomio 
  title: "Advanced Microeconomics"
  instructor: "Marco LiCalzi"
  url: https://www.unive.it/data/course/585612
  hours: 30
  period: "Nov.-Dec."
  intensive: "N"
  in_person: "Y"
  online: "N"
  syllabus: https://www.unive.it/data/course/585612/programma


intro_en:
- This inventory lists the doctoral courses in the SECS-S06 area planned for academic year 2026–2027.
  It is a collection that aims to map the training on offer in this scientific-disciplinary area.
- 'Each course comes with the following information: title, number of hours, delivery period, general
  programme, contact person, and whether external students can attend it in person or online.'
- The aim is to offer a menu of courses from which doctoral students can choose to build their own training
  path. Interested students can contact the course's contact person directly.
- Courses are grouped by university and PhD programme.
- Information was collected as of 21 August 2026. Corrections and proposals for new courses can be brought
  to the attention of any member of the working group.
intro_it:
- Il documento contiene un inventario dei corsi di dottorato nell’Area SECS-S06 previsti per l’A.A 2026-2027.
  Si tratta di una raccolta che intende mappare l’offerta formativa nell’area scientifica disciplinare.
- 'Ogni corso presenta le seguenti informazioni: titolo, numero di ore, periodo di erogazione, programma
  di massima, referente, possibilità di seguirlo in presenza o on-line da parte di esterni.'
- L’obiettivo è di offrire un menù di corsi, tra cui i dottorandi possono scegliere per costruire il loro
  percorso formativo. Gli interessati possono contattare direttamente il referente del corso.
- I corsi sono stati raggruppati per Università-corso di dottorato e sono riportati per titolo all’inizio
  del documento.
- Il documento contiene le informazioni raccolte al 21 agosto 2026. Eventuali segnalazioni di inesattezze/proposte
  di corsi possono essere portate all’attenzione di uno dei componenti del gruppo di lavoro.


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="container">
    {{ content }}
    <footer>
      {% if site.github.repository_url %}<a href="{{ site.github.repository_url }}">Edit on GitHub</a> &middot; {% endif %}<a href="{{ '/courses.json' | relative_url }}">Data (JSON)</a>
    </footer>
  </div>
  <script src="{{ '/assets/js/filter.js' | relative_url }}" defer></script>
</body>
</html>

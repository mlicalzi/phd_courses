# Template for one course. Copy it to data/courses/<university-id>/<short-name>.yaml
# (files starting with "_" are ignored by the build).
#
# `id` defaults to the file name and `university_id` to the folder name, so both can be left out.
#
# Pairs of fields: the *_raw text is what the page displays, exactly as the university wrote it;
# the twin without _raw is the value used by filters, statistics and the CSV. Leave the twin out
# (or null) when the raw text cannot be reduced to a value.
#
# yes / no / conditional are plain text here (no quotes needed in this project).

title: Course title

phd_programs:                     # PhD programme(s) the course belongs to
  - PhD in ...

referent_raw: Name Surname (name.surname@university.it)
emails:                           # addresses to put in the CSV
  - name.surname@university.it

hours_raw: 30 ore accademiche
hours: 30                         # a single number, or null for ranges / sums / free text

period_raw: Novembre - Dicembre
period_months: [11, 12]           # calendar months it runs (1-12); [] if unknown

intensive_raw: no
intensive: no                     # yes | no | null

in_person_raw: Sì                 # open to external students in person?
in_person: yes                    # yes | no | conditional | null
online_raw: No                    # open to external students online?
online: no                        # yes | no | conditional | null

program: |
  General programme ("Programma di massima").
  Line breaks are kept.

syllabus: |
  Syllabus, if different from or more detailed than the programme.

notes: ""

links:                            # optional extra links (http, https or mailto)
  - text: Course page
    url: https://example.org/course

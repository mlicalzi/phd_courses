intro_en:
- This inventory lists doctoral courses in the SECS-S06 area planned for academic year 2026–2027.
  It aims to map the training on offer in this scientific-disciplinary area.
- Each course comes with the following information: title, number of hours, delivery period, general
  programme, contact person, and whether external students can attend it in person or online.
- The aim is to offer a menu of courses from which doctoral students can choose to build their own training
  path. Interested students can contact the course's contact person directly.
- Courses are grouped by university and PhD programme.
- Information was collected as of 21 August 2026. Corrections and proposals for new courses can be brought
  to the attention of any member of the working group.
